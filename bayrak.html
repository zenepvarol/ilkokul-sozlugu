<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Türkçe Sözlük - Bayrak</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1); 
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        img { 
            max-width: 100%; 
            height: auto;
            border-radius: 8px; 
            margin: 15px 0;
        }
        h1 { 
            color: #d9534f; 
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        p {
            font-size: 1.1rem;
            color: #444;
        }
        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bayrak</h1>
        <p><b>Anlamı:</b> Bir ülkenin egemenlik simgesi olan renkli kumaş.</p>
        
        <!-- Görselin -->
        <img src="flag.png" alt="Bayrak görseli">
        
        <!-- Bilgisayardan yüklediğin ses dosyası (istiklal.mp3 yerine kendi dosya adını yazabilirsin) -->
        <audio controls>
            <source src="istanbul.mp3" type="audio/mpeg">
            Tarayıcınız ses oynatıcısını desteklemiyor.
        </audio>
    </div>
</body>
</html>
