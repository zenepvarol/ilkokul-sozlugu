<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Türkçe Sözlük - Bayrak</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f9; 
            padding: 40px 20px; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            display: inline-block; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1); 
            max-width: 500px;
            width: 100%;
        }
        img { 
            max-width: 100%; 
            border-radius: 8px; 
            margin: 15px 0;
        }
        h1 { 
            color: #d9534f; 
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        p {
            font-size: 1.2rem;
            color: #444;
        }
        .video-container {
            margin-top: 20px;
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Oranı */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bayrak</h1>
        <p><b>Anlamı:</b> Bir ülkenin egemenlik simgesi olan renkli kumaş.</p>
        
        <!-- Görselin -->
        <img src="flag.png" alt="Bayrak görseli">
        
        <!-- Video Alanı (YouTube Gömmeli) -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/watch?v=ZgWu6_J7jtE" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
