<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Türkçe Sözlük - Millet</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #f4f4f9; 
            padding-top: 50px; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            display: inline-block; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1); 
        }
        img { 
            max-width: 300px; 
            border-radius: 8px; 
            margin: 15px 0;
        }
        h1 { 
            color: #d9534f; 
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        p {
            font-size: 1.2rem;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Vatan</h1>
        <p><b>Anlamı:</b> Bir milletin egemen olarak üzerinde yaşadığı, kültürünü oluşturduğu ve bağımsızlığını sürdürdüğü toprak parçası, yurt ve memlekettir.</p>
        
        <img src="vatan.png" alt="Vatan görseli">
    </div>
</body>
</html>
